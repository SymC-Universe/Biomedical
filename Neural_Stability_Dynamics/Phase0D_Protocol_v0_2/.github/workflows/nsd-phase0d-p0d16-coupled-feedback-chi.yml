name: NSD P0-D16 Coupled Feedback Chi Surface

on:
  push:
    branches:
      - neural-stability-dynamics-phase0d-v0.2-protocol-v0.7.1
    paths:
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/src/coupled_conglomeration.py'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/src/chi_conglomerate.py'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/tests/test_coupled_conglomeration_p0.py'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/scripts/run_p0d16_coupled_feedback_chi_surface.py'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/.github/workflows/nsd-phase0d-p0d16-coupled-feedback-chi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0d16-coupled-feedback-chi:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Neural_Stability_Dynamics/Phase0D_Protocol_v0_2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned P0 dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest
      - name: Run coupled conglomeration mathematical tests
        run: python -m pytest -q tests/test_coupled_conglomeration_p0.py tests/test_chi_conglomerate_p0.py
      - name: Run P0-D16 coupled feedback chi surface
        run: python scripts/run_p0d16_coupled_feedback_chi_surface.py --output results/p0d_mapping/coupled_feedback_chi_surface_v1.json
      - name: Capture numerical environment
        run: python scripts/capture_environment.py results/p0d_mapping/coupled_feedback_chi_environment.json
      - name: Upload P0-D16 artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsd-phase0d-p0d16-coupled-feedback-chi
          path: |
            Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/results/p0d_mapping/coupled_feedback_chi_surface_v1.json
            Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/results/p0d_mapping/coupled_feedback_chi_environment.json
          if-no-files-found: error
