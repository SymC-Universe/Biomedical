name: Bio Chi Shaffer source schema v0.1
on:
  push:
    branches: [bio-chi-topdown-pivot-20260924]
    paths:
      - 'BIO_CHI/config/SHAFFER2017_SOURCE_SCHEMA_FREEZE_v0_1.json'
      - 'BIO_CHI/src/audit_shaffer2017_source_schema_v0_1.py'
      - '.github/workflows/bio-chi-shaffer-source-schema-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit GEO metadata and supplementary file listings only
        run: python BIO_CHI/src/audit_shaffer2017_source_schema_v0_1.py
      - name: Upload source schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_SHAFFER_SOURCE_SCHEMA_V01
          path: BIO_CHI/artifacts/generated/shaffer2017_source_schema_v0_1.json
          if-no-files-found: error
