name: Bio Chi Blum schema inventory v0.1

on:
  push:
    branches:
      - chi-bio-recovery-p0d-20260922
    paths:
      - 'BIO_CHI/config/BLUM2019_MENDELEY_SOURCE_FREEZE_V02_RESULT_PIN.json'
      - 'BIO_CHI/config/BLUM2019_SCHEMA_INVENTORY_FREEZE_v0_1.json'
      - 'BIO_CHI/src/inventory_blum_mendeley_archive_v0_1.py'
      - '.github/workflows/bio-chi-blum-schema-inventory-v01.yml'
  pull_request:
    paths:
      - 'BIO_CHI/config/BLUM2019_MENDELEY_SOURCE_FREEZE_V02_RESULT_PIN.json'
      - 'BIO_CHI/config/BLUM2019_SCHEMA_INVENTORY_FREEZE_v0_1.json'
      - 'BIO_CHI/src/inventory_blum_mendeley_archive_v0_1.py'
      - '.github/workflows/bio-chi-blum-schema-inventory-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory ZIP metadata only after frozen-hash verification
        run: python BIO_CHI/src/inventory_blum_mendeley_archive_v0_1.py
      - name: Upload metadata-only inventory
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_BLUM_SCHEMA_INVENTORY_V01
          path: BIO_CHI/artifacts/generated/blum2019_schema_inventory_v0_1.json
          if-no-files-found: error
