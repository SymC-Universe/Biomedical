name: Bio Chi NFkB D2FC2 native modal P0-Q v0.1

on:
  workflow_dispatch:
  push:
    branches:
      - bio-chi-nfkb-d2fc-native-modal-p0q-20260926
    paths:
      - "BIO_CHI/experiments/nfkb_d2fc_native_modal_p0q_v01.m"
      - ".github/workflows/bio-chi-nfkb-d2fc-native-modal-p0q-v01.yml"

jobs:
  execute-frozen-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned D2FC squared source
        run: |
          git clone https://github.com/recleelab/D2FCSquared.git nfkb_d2fc_source
          cd nfkb_d2fc_source
          git checkout 4414c1556e3068c9bfe2162d5ba9d2cf770713fc
          test "$(git rev-parse HEAD)" = "4414c1556e3068c9bfe2162d5ba9d2cf770713fc"
      - name: Set up MATLAB and SimBiology
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: SimBiology
      - name: Execute frozen native-modal gate
        uses: matlab-actions/run-command@v3
        with:
          command: addpath("BIO_CHI/experiments"); nfkb_d2fc_native_modal_p0q_v01
      - name: Hash result bundle
        if: always()
        run: |
          find BIO_CHI/experiments/nfkb_d2fc_results -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > BIO_CHI/experiments/nfkb_d2fc_results/SHA256SUMS.txt || true
      - name: Upload complete result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_NFKB_D2FC_NATIVE_MODAL_P0Q_V01
          path: BIO_CHI/experiments/nfkb_d2fc_results/
          if-no-files-found: warn
