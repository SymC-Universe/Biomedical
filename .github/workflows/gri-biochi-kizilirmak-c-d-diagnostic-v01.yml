name: GRI Bio Chi Kizilirmak C plus D diagnostic v0.1
on:
  push:
    branches: [gri-biochi-bridge-p0q-20260925]
    paths:
      - 'BIO_CHI/control/KIZILIRMAK2023_C_D_POSTRESULT_DIAGNOSTIC_FREEZE_20260925.md'
      - 'BIO_CHI/src/diagnose_kizilirmak2023_c_d_v0_1.py'
      - '.github/workflows/gri-biochi-kizilirmak-c-d-diagnostic-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy xlrd
      - name: Run frozen post-result diagnostics
        run: python BIO_CHI/src/diagnose_kizilirmak2023_c_d_v0_1.py
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KIZILIRMAK2023_C_D_DIAGNOSTIC_V01
          path: |
            BIO_CHI/artifacts/generated/kizilirmak2023_c_d_diagnostic_v01/KIZILIRMAK2023_C_D_DIAGNOSTIC_V01.json
            BIO_CHI/artifacts/generated/kizilirmak2023_c_d_diagnostic_v01/KIZILIRMAK2023_C_D_DIAGNOSTIC_AUDIT_V01.md
          if-no-files-found: error
