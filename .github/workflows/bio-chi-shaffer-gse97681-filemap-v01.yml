name: Bio Chi Shaffer GSE97681 file map v0.1
on:
  push:
    branches: [bio-chi-topdown-pivot-20260924]
    paths:
      - 'BIO_CHI/config/SHAFFER2017_GSE97681_FILEMAP_FREEZE_v0_1.json'
      - 'BIO_CHI/src/audit_shaffer2017_gse97681_filemap_v0_1.py'
      - '.github/workflows/bio-chi-shaffer-gse97681-filemap-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Freeze processed-file identities, headers and recovery labels
        run: python BIO_CHI/src/audit_shaffer2017_gse97681_filemap_v0_1.py
      - name: Upload file map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_SHAFFER_GSE97681_FILEMAP_V01
          path: BIO_CHI/artifacts/generated/shaffer2017_gse97681_filemap_v0_1.json
          if-no-files-found: error
