name: GRI Bio Chi Kizilirmak source preflight v0.1
on:
  push:
    branches: [gri-biochi-bridge-p0q-20260925]
    paths:
      - 'BIO_CHI/config/KIZILIRMAK2023_CHI_GRI_DYNAMICS_FREEZE_v0_1.json'
      - 'BIO_CHI/src/audit_kizilirmak2023_source_preflight_v0_1.py'
      - '.github/workflows/gri-biochi-kizilirmak-source-preflight-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Excel schema reader
        run: python -m pip install --disable-pip-version-check xlrd
      - name: Materialize exact source and inspect schema only
        run: python BIO_CHI/src/audit_kizilirmak2023_source_preflight_v0_1.py
      - name: Upload source preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KIZILIRMAK2023_SOURCE_PREFLIGHT_V01
          path: |
            BIO_CHI/artifacts/generated/kizilirmak2023_source_preflight_v01/KIZILIRMAK2023_SOURCE_PREFLIGHT_V01.json
            BIO_CHI/artifacts/generated/kizilirmak2023_source_preflight_v01/KIZILIRMAK2023_SOURCE_PREFLIGHT_V01_AUDIT.md
          if-no-files-found: error
