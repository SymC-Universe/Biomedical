name: GRI Bio Chi Harmange source schema v0.1
on:
  push:
    branches: [gri-biochi-bridge-p0q-20260925]
    paths:
      - 'BIO_CHI/config/HARMANGE2023_GRI_BIOCHI_BRIDGE_SOURCE_FREEZE_v0_1.json'
      - 'BIO_CHI/src/audit_harmange2023_gri_biochi_source_schema_v0_1.py'
      - '.github/workflows/gri-biochi-harmange-source-schema-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit frozen Harmange source objects
        run: python BIO_CHI/src/audit_harmange2023_gri_biochi_source_schema_v0_1.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HARMANGE2023_GRI_BIOCHI_SOURCE_SCHEMA_V01
          path: |
            BIO_CHI/artifacts/generated/harmange2023_gri_biochi_source_schema_v0_1.json
            BIO_CHI/artifacts/generated/HARMANGE2023_GRI_BIOCHI_SOURCE_SCHEMA_V0_1_AUDIT.md
          if-no-files-found: error
