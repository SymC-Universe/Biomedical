name: Bio Chi Umeki EGF depth-rate P0-Q v0.1
on:
  push:
    branches: [bio-chi-erk-egf-depth-rate-p0q-20260925]
    paths:
      - "BIO_CHI/experiments/umeki2025_egf_depth_rate_p0q_v01.py"
      - ".github/workflows/bio-chi-umeki-egf-depth-rate-p0q-v01.yml"
  workflow_dispatch:
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.1.3" "pandas==2.2.3" "scikit-learn==1.5.2"
      - name: Execute frozen EGF depth-rate gate
        run: python BIO_CHI/experiments/umeki2025_egf_depth_rate_p0q_v01.py
      - name: Hash result bundle
        if: always()
        run: find BIO_CHI/experiments/umeki2025_egf_depth_rate_results -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > BIO_CHI/experiments/umeki2025_egf_depth_rate_results/SHA256SUMS.txt || true
      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_UMEKI2025_EGF_DEPTH_RATE_P0Q_V01
          path: BIO_CHI/experiments/umeki2025_egf_depth_rate_results/
          if-no-files-found: warn
