name: Bio Chi Meneses 2026 source-method reconciliation v0.1
on:
  push:
    branches: [bio-chi-ecoli-pmf-recovery-p0q-20260925]
    paths:
      - "BIO_CHI/experiments/meneses2026_source_method_reconciliation_v01.py"
      - ".github/workflows/bio-chi-meneses2026-source-method-reconciliation-v01.yml"
  workflow_dispatch:
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "numpy==2.1.3" "pandas==2.2.3" "scipy==1.14.1" "requests==2.32.3" "pyarrow==18.1.0"
      - run: python BIO_CHI/experiments/meneses2026_source_method_reconciliation_v01.py
      - if: always()
        run: find BIO_CHI/experiments/meneses2026_reconciliation_results -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > BIO_CHI/experiments/meneses2026_reconciliation_results/SHA256SUMS.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_MENESES2026_SOURCE_METHOD_RECONCILIATION_V01
          path: BIO_CHI/experiments/meneses2026_reconciliation_results/
          if-no-files-found: warn
