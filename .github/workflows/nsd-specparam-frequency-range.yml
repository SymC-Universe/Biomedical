name: NSD specparam Frequency Range Calibration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/nsd-specparam-frequency-range.yml"
      - "NSD_vNext/engine/pyproject.toml"
      - "NSD_vNext/engine/nsd_engine/specparam_adapter.py"
      - "NSD_vNext/engine/tools/calibrate_specparam_frequency_range.py"

permissions:
  contents: read

jobs:
  calibrate-frequency-range:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen qualification stack
        shell: bash
        working-directory: NSD_vNext/engine
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[parameterization_rc7]"

      - name: Run fixed-mode frequency-range calibration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nsd_specparam_range"
          python NSD_vNext/engine/tools/calibrate_specparam_frequency_range.py \
            > "$RUNNER_TEMP/nsd_specparam_range/frequency_range_calibration.json"

      - name: Print compact range summary
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/nsd_specparam_range/frequency_range_calibration.json"
          python - "$REPORT" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          print("candidate_count", report["candidate_count"])
          print("passing_count", report["passing_count"])
          print("passing_settings")
          for settings in report["passing_settings"]:
              print(json.dumps(settings, sort_keys=True))
          print("compact_rows")
          for row in report["results"]:
              s = row["settings"]
              x = row["summary"]
              print(json.dumps({
                  "fmin": s["fmin_hz"],
                  "fmax": s["fmax_hz"],
                  "threshold": s["peak_threshold"],
                  "max_peaks": s["max_n_peaks"],
                  "pass": row["candidate_pass"],
                  "fixed_no_peak_fp": row["fixed_truth"]["no_peak"]["false_positive_rate"],
                  "knee_no_peak_fp": row["knee_truth"]["no_peak"]["false_positive_rate"],
                  "strong_recovery": x["strong_recovery"],
                  "strong_exact_one": x["strong_exact_one"],
                  "strong_extra": x["strong_false_extra"],
                  "min_two_peak_recovery": x["minimum_two_peak_recovery"],
              }, sort_keys=True))
          PY

      - name: Upload calibration report
        uses: actions/upload-artifact@v4
        with:
          name: nsd-specparam-frequency-range-calibration
          path: ${{ runner.temp }}/nsd_specparam_range/frequency_range_calibration.json
          if-no-files-found: error
          retention-days: 30
