name: GRI conglomerate R/S streamed source verification

on:
  workflow_dispatch:
  push:
    branches:
      - gri-conglomerate-v1-integration-20260921
    paths:
      - ".github/workflows/gri-conglomerate-rs-stream-verify.yml"
      - "GRI_v2/src/stream_verify_conglomerate_rs_sources.py"
      - "GRI_v2/tests/test_stream_verify_conglomerate_rs_sources.py"
      - "GRI_v2/config/chi_bio_conglomerate_v01_source_bindings.json"
      - "GRI_v2/development_outputs/stage_c0_methylation/STAGE_C0_METHYLATION_SOURCE_SUMMARY.json"

permissions:
  contents: read

concurrency:
  group: gri-conglomerate-rs-stream-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: GRI_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run binding unit tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_stream_verify_conglomerate_rs_sources.py
      - name: Stream and hash exact R/S sources
        run: |
          python -m src.stream_verify_conglomerate_rs_sources
      - name: Print compact result
        run: |
          python - <<'PY'
          import json
          p="conglomerate_v01_outputs/large_rs_stream_verification.json"
          d=json.load(open(p,encoding="utf-8"))
          print("status", d["status"])
          for s in d["sources"]:
              print(
                  s["block_id"],
                  "bytes", s["bytes_hashed"],
                  "ranges", s["range_count"],
                  "hash_match", s["hash_match"],
                  "sha256", s["sha256"],
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GRI_CONGLOMERATE_RS_STREAM_VERIFICATION_V01
          path: GRI_v2/conglomerate_v01_outputs/large_rs_stream_verification.json
          if-no-files-found: error
          retention-days: 30
