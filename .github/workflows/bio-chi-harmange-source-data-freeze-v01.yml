name: Bio Chi Harmange Source Data workbook freeze v0.1
on:
  push:
    branches: [bio-chi-topdown-pivot-20260924]
    paths:
      - 'BIO_CHI/config/HARMANGE2023_SOURCE_DATA_WORKBOOK_FREEZE_v0_1.json'
      - 'BIO_CHI/src/freeze_harmange2023_source_data_workbook_v0_1.py'
      - '.github/workflows/bio-chi-harmange-source-data-freeze-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Freeze Nature Source Data bytes and text-only workbook schema
        run: python BIO_CHI/src/freeze_harmange2023_source_data_workbook_v0_1.py
      - name: Upload source freeze
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_HARMANGE_SOURCE_DATA_FREEZE_V01
          path: BIO_CHI/artifacts/generated/harmange2023_source_data_workbook_freeze_v0_1.json
          if-no-files-found: error
