name: GRI SCC25 G2 scalar-admission diagnostic

on:
  push:
    branches:
      - gri-chi-bio-conglomerate-v01-20260918
      - gri-conglomerate-v1-integration-20260921
    paths:
      - "GRI_v2/docs/GRI_SCC25_G2_SCALAR_ADMISSION_DIAGNOSTIC_PROTOCOL_20260921.md"
      - "GRI_v2/src/run_scc25_g2_scalar_admission_diagnostic.py"
      - ".github/workflows/gri-scc25-g2-scalar-admission-diagnostic.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GRI_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check -q "numpy>=2,<3" "pandas>=2,<3"
      - name: Run post-result eigenstructure diagnostic
        run: python -m src.run_scc25_g2_scalar_admission_diagnostic
      - uses: actions/upload-artifact@v4
        with:
          name: GRI_SCC25_G2_SCALAR_ADMISSION_EIGENSTRUCTURE_V01
          path: GRI_v2/development_outputs/scc25_g2_scalar_admission_diagnostic/GRI_SCC25_G2_SCALAR_ADMISSION_EIGENSTRUCTURE_V01.json
          if-no-files-found: error
