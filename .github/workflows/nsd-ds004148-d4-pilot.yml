name: NSD ds004148 D4 Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - nsd-rebuild-gom-v0.8.0
    paths:
      - ".github/workflows/nsd-ds004148-d4-pilot.yml"
      - "NSD_vNext/docs/manifests/ds004148_d4_pilot_expectation_v0.1.json"
      - "NSD_vNext/engine/tools/d4_verify_ds004148_pilot.py"

permissions:
  contents: read

concurrency:
  group: nsd-ds004148-d4-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and reconcile raw BrainVision pilot
        run: |
          python NSD_vNext/engine/tools/d4_verify_ds004148_pilot.py \
            --manifest NSD_vNext/docs/manifests/ds004148_d4_pilot_expectation_v0.1.json \
            --download-dir "$RUNNER_TEMP/nsd_ds004148_d4" \
            --output "$RUNNER_TEMP/nsd_ds004148_d4_report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ds004148-d4-pilot-report-v0-1
          path: ${{ runner.temp }}/nsd_ds004148_d4_report.json
          if-no-files-found: error
          retention-days: 30
