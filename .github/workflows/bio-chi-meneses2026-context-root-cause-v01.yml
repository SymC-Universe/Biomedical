name: Bio Chi Meneses context transport root-cause v0.1
on:
  push:
    branches: [bio-chi-meneses-context-transport-p0q-20260925]
    paths:
      - "BIO_CHI/experiments/meneses2026_context_transport_root_cause_v01.py"
      - ".github/workflows/bio-chi-meneses2026-context-root-cause-v01.yml"
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "numpy==2.1.3" "pandas==2.2.3" "scipy==1.14.1" "requests==2.32.3" "pyarrow==18.1.0"
      - run: python BIO_CHI/experiments/meneses2026_context_transport_root_cause_v01.py
      - if: always()
        run: find BIO_CHI/experiments/meneses2026_context_transport_diagnostics -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > BIO_CHI/experiments/meneses2026_context_transport_diagnostics/SHA256SUMS.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_MENESES2026_CONTEXT_TRANSPORT_ROOT_CAUSE_V01
          path: BIO_CHI/experiments/meneses2026_context_transport_diagnostics/
          if-no-files-found: warn
