name: Bio Chi HOG1 input-context P0-Q v0.1
on:
  push:
    branches: [bio-chi-hog1-input-context-p0q-20260925]
    paths:
      - "BIO_CHI/experiments/hog1_input_context_p0q_v01.py"
      - ".github/workflows/bio-chi-hog1-input-context-p0q-v01.yml"
  workflow_dispatch:
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "numpy==2.1.3" "scipy==1.14.1"
      - run: python BIO_CHI/experiments/hog1_input_context_p0q_v01.py
      - if: always()
        run: find BIO_CHI/experiments/hog1_results -type f -maxdepth 1 -print0 | sort -z | xargs -0 sha256sum > BIO_CHI/experiments/hog1_results/SHA256SUMS.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_HOG1_INPUT_CONTEXT_P0Q_V01
          path: BIO_CHI/experiments/hog1_results/
          if-no-files-found: warn
