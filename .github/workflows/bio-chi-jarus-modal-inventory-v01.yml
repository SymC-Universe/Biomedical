name: Bio Chi Jaruszewicz modal inventory v0.1

on:
  push:
    branches:
      - chi-bio-recovery-p0d-20260922
    paths:
      - 'BIO_CHI/config/JARUS_MODAL_INVENTORY_FREEZE_v0_1.json'
      - 'BIO_CHI/src/inventory_jarus_modes_v01.py'
      - '.github/workflows/bio-chi-jarus-modal-inventory-v01.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  modal-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_ARTIFACT_ID: '10748186325'
      SOURCE_ARTIFACT_SHA256: '7b17c4b2ec5c3cfd280eac48155903f329a57a1a62e4918ef4fcac4ed3aea7a9'
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable v0.3 local-stability artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/BIO_CHI_JARUS_LOCAL_STABILITY_V03.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip"
          echo "${SOURCE_ARTIFACT_SHA256}  /tmp/BIO_CHI_JARUS_LOCAL_STABILITY_V03.zip" | sha256sum -c -
      - name: Inventory every stored eigenmode
        run: python BIO_CHI/src/inventory_jarus_modes_v01.py /tmp/BIO_CHI_JARUS_LOCAL_STABILITY_V03.zip
      - name: Upload descriptive modal inventory
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_JARUS_MODAL_INVENTORY_V01
          path: BIO_CHI/artifacts/generated/jarus_modal_inventory_v01/modal_inventory_v0_1.json
          if-no-files-found: error
