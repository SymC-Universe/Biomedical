name: GRI Chi_bio GEO source probe

on:
  pull_request:
    paths:
      - 'GRI_v2/src/probe_chi_bio_geo_sources.py'
      - 'GRI_v2/config/gri_hnscc_shortterm_cetuximab_manifest_p0d_v0_1.json'
      - 'GRI_v2/config/gri_hnscc_day5_atac_manifest_p0d_v0_1.json'
      - '.github/workflows/gri-v2-chi-bio-geo-source-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: GRI_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe frozen public GEO supplementary sources
        run: python -m src.probe_chi_bio_geo_sources
      - name: Upload provenance report only
        uses: actions/upload-artifact@v4
        with:
          name: gri-chi-bio-geo-source-probe
          path: GRI_v2/development_outputs/chi_bio_geo_source_probe/GRI_CHI_BIO_GEO_SOURCE_PROBE.json
          if-no-files-found: error
