name: Bio Chi Jaruszewicz joint source audit v0.2

on:
  push:
    branches:
      - chi-bio-recovery-p0d-20260922
    paths:
      - '.github/workflows/bio-chi-jarus-joint-source-audit-v02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned source
        run: |
          set -euo pipefail
          bash BIO_CHI/src/prepare_jarus_matlab_compat.sh
      - name: Emit complete joint-source literals
        run: |
          set -euo pipefail
          python BIO_CHI/src/audit_jarus_joint_source_inputs.py
          cat BIO_CHI/artifacts/generated/jarus_joint_source_audit/jarus_joint_source_audit_v0_1.json
      - uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_JARUS_JOINT_SOURCE_AUDIT_V02
          path: BIO_CHI/artifacts/generated/jarus_joint_source_audit/
          if-no-files-found: error
