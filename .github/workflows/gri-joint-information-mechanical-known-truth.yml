name: GRI joint-information mechanical known-truth

on:
  push:
    branches:
      - gri-chi-bio-conglomerate-v01-20260918
      - gri-conglomerate-v1-integration-20260921
    paths:
      - "GRI_v2/src/joint_information_mechanical_known_truth_v01.py"
      - ".github/workflows/gri-joint-information-mechanical-known-truth.yml"
  workflow_dispatch:

jobs:
  known-truth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GRI_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check -q "numpy>=2,<3" "scipy>=1.14,<2"
      - name: Run joint-information known-truth gate
        run: python -m src.joint_information_mechanical_known_truth_v01
      - uses: actions/upload-artifact@v4
        with:
          name: GRI_JOINT_INFORMATION_MECHANICAL_KNOWN_TRUTH_V01
          path: GRI_v2/joint_information_known_truth_outputs/mechanical_known_truth_v01.json
          if-no-files-found: error
