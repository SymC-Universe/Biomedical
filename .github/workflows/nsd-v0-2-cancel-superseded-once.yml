      - nsd-rebuild-gom-v0.8.0
    paths:
      - ".github/workflows/nsd-v0-2-cancel-superseded-once.yml"

permissions:
  contents: read

concurrency:
  group: nsd-v0-2-frozen-evidence-conveyor
