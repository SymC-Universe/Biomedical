name: GRI Chi_bio chronic G2 bounded feature-gate robustness

on:
  workflow_dispatch:
  push:
    branches:
      - gri-v071-protocol-integration-20260910-chi-bio
    paths:
      - 'GRI_v2/src/audit_chi_bio_chronic_g2_feature_gate_robustness.py'
      - 'GRI_v2/tests/test_chi_bio_chronic_g2_feature_gate_robustness.py'
      - '.github/workflows/gri-v2-chi-bio-chronic-g2-feature-gate-robustness.yml'

permissions:
  contents: read

jobs:
  qualify-bounded-robustness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: GRI_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run full GRI tests before bounded diagnostic execution
        run: python -m pytest -q tests
      - name: Verify diagnostic thresholds cannot replace primary gate
        run: |
          python - <<'PY'
          from src.audit_chi_bio_chronic_g2_feature_gate_robustness import DIAGNOSTIC_GATES, PRIMARY_REFERENCE
          assert PRIMARY_REFERENCE['threshold'] == 1.0
          assert {x['threshold'] for x in DIAGNOSTIC_GATES.values()} == {0.1, 10.0}
          assert all(x['threshold'] != 1.0 for x in DIAGNOSTIC_GATES.values())
          print('BOUNDED_FEATURE_GATE_ROBUSTNESS_QUALIFIED')
          PY

  run-bounded-robustness:
    needs: qualify-bounded-robustness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: GRI_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Execute both predeclared feature-gate diagnostics
        run: python -m src.audit_chi_bio_chronic_g2_feature_gate_robustness
      - name: Upload bounded robustness record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gri-chi-bio-chronic-g2-feature-gate-robustness-v1
          path: GRI_v2/development_outputs/chi_bio_chronic_g2_feature_gate_robustness/GRI_CHI_BIO_CHRONIC_G2_FEATURE_GATE_ROBUSTNESS.json
          retention-days: 90
          if-no-files-found: error
