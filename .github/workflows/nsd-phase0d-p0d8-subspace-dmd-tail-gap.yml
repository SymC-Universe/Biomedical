name: NSD P0-D8 Subspace-DMD Tail-Gap Forensics

on:
  workflow_dispatch:
  push:
    branches:
      - neural-stability-dynamics-phase0d-v0.2-protocol-v0.7.1
    paths:
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/scripts/run_p0d8_subspace_dmd_tail_gap.py'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/P0D8_SUBSPACE_DMD_TAIL_GAP_PLAN.md'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/src/dmd.py'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/src/rank_sweep.py'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/src/rank_gate.py'
      - '.github/workflows/nsd-phase0d-p0d8-subspace-dmd-tail-gap.yml'

permissions:
  contents: read

jobs:
  p0d8-tail-gap-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Neural_Stability_Dynamics/Phase0D_Protocol_v0_2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned P0 dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Run P0-D8 forensics
        run: python scripts/run_p0d8_subspace_dmd_tail_gap.py --output results/p0d_mapping/subspace_dmd_tail_gap_v1.json
      - name: Capture environment
        run: python scripts/capture_environment.py results/p0d_mapping/subspace_dmd_tail_gap_environment.json
      - name: Upload P0-D8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsd-phase0d-p0d8-subspace-dmd-tail-gap
          path: |
            Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/results/p0d_mapping/subspace_dmd_tail_gap_v1.json
            Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/results/p0d_mapping/subspace_dmd_tail_gap_environment.json
          if-no-files-found: error
