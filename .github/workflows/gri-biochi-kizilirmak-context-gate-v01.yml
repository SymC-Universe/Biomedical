name: GRI Bio Chi Kizilirmak context gate v0.1
on:
  push:
    branches: [gri-biochi-bridge-p0q-20260925]
    paths:
      - 'BIO_CHI/control/KIZILIRMAK2023_CONTEXT_GATE_DIAGNOSTIC_FREEZE_20260925.md'
      - 'BIO_CHI/control/KIZILIRMAK2023_CONTEXT_GATE_IMPLEMENTATION_AMENDMENT_20260925.md'
      - 'BIO_CHI/src/diagnose_kizilirmak2023_context_gate_v0_1.py'
      - '.github/workflows/gri-biochi-kizilirmak-context-gate-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy xlrd
      - name: Run context-gating diagnostic
        run: python BIO_CHI/src/diagnose_kizilirmak2023_context_gate_v0_1.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KIZILIRMAK2023_CONTEXT_GATE_V01
          path: |
            BIO_CHI/artifacts/generated/kizilirmak2023_context_gate_v01/KIZILIRMAK2023_CONTEXT_GATE_V01.json
            BIO_CHI/artifacts/generated/kizilirmak2023_context_gate_v01/KIZILIRMAK2023_CONTEXT_GATE_AUDIT_V01.md
          if-no-files-found: error
