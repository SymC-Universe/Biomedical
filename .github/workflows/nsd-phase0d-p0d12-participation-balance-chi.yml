name: NSD P0-D12 Participation-Balance Chi

on:
  workflow_dispatch:
  push:
    branches:
      - neural-stability-dynamics-phase0d-v0.2-protocol-v0.7.1
    paths:
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/src/chi_conglomerate.py'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/src/participation_balance.py'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/scripts/run_p0d12_participation_balance_chi.py'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/tests/test_chi_conglomerate_p0.py'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/tests/test_participation_balance_p0.py'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/P0D12_PARTICIPATION_BALANCE_CHI_PLAN.md'
      - '.github/workflows/nsd-phase0d-p0d12-participation-balance-chi.yml'

permissions:
  contents: read

jobs:
  p0d12-participation-balance-chi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Neural_Stability_Dynamics/Phase0D_Protocol_v0_2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned P0 dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest
      - name: Run chi and participation unit tests
        run: python -m pytest -q tests/test_chi_conglomerate_p0.py tests/test_participation_balance_p0.py
      - name: Run P0-D12 participation diagnosis
        run: python scripts/run_p0d12_participation_balance_chi.py --output results/p0d_mapping/participation_balance_chi_v1.json
      - name: Capture numerical environment
        run: python scripts/capture_environment.py results/p0d_mapping/participation_balance_chi_environment.json
      - name: Upload P0-D12 artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsd-phase0d-p0d12-participation-balance-chi
          path: |
            Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/results/p0d_mapping/participation_balance_chi_v1.json
            Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/results/p0d_mapping/participation_balance_chi_environment.json
          if-no-files-found: error
