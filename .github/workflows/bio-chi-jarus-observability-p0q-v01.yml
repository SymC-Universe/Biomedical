name: Bio Chi Jaruszewicz oscillatory observability P0-Q

on:
  push:
    branches:
      - chi-bio-recovery-p0d-20260922
    paths:
      - BIO_CHI/config/JARUS_OSCILLATORY_MODE_OBSERVABILITY_P0Q_FREEZE_v0_1.json
      - BIO_CHI/src/qualify_jarus_oscillatory_mode_observability_v0_1.py
      - .github/workflows/bio-chi-jarus-observability-p0q-v01.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.3 scipy==1.16.2

      - name: Retrieve exact frozen upstream artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p upstream/trajectory upstream/stability output
          gh api repos/${{ github.repository }}/actions/artifacts/10746629733/zip > trajectory.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10748186325/zip > stability.zip
          echo "f2bebf6605b2e794f81473d776146f0109752ddc1e6eed1750a3deb4ec44e32b  trajectory.zip" | sha256sum -c -
          echo "7b17c4b2ec5c3cfd280eac48155903f329a57a1a62e4918ef4fcac4ed3aea7a9  stability.zip" | sha256sum -c -
          unzip -q trajectory.zip -d upstream/trajectory
          unzip -q stability.zip -d upstream/stability

      - name: Execute P0-Q qualifier and known-bad refusal
        run: |
          python BIO_CHI/src/qualify_jarus_oscillatory_mode_observability_v0_1.py \
            --stability-json upstream/stability/local_stability_v0_3.json \
            --trajectory-csv upstream/trajectory/jarus_fig8_execution_v02/FIG8A_NOMINAL_DAMPED/trajectory_raw.csv \
            --semantic-json upstream/trajectory/jarus_fig8_execution_v02/FIG8A_NOMINAL_DAMPED/semantic_map.json \
            --freeze-json BIO_CHI/config/JARUS_OSCILLATORY_MODE_OBSERVABILITY_P0Q_FREEZE_v0_1.json \
            --out output/observability_p0q_v0_1.json \
            --self-test-out output/known_bad_refusal_v0_1.json
          grep -q '"pass_gate": true' output/observability_p0q_v0_1.json
          grep -q '"pass_gate": false' output/known_bad_refusal_v0_1.json
          sha256sum output/*.json > output/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_JARUS_OBSERVABILITY_P0Q_V01
          path: output/
          if-no-files-found: error
          retention-days: 90
