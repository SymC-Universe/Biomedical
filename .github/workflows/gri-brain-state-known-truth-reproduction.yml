name: SymC brain-state source-native known-truth reproduction

on:
  push:
    branches:
      - gri-chi-bio-conglomerate-v01-20260918
    paths:
      - "GRI_v2/src/brain_state_known_truth_source_reproduction_v01.py"
      - ".github/workflows/gri-brain-state-known-truth-reproduction.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GRI_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source-native analysis dependencies
        run: python -m pip install --disable-pip-version-check -q "numpy>=2,<3" "pandas>=2,<3" "scipy>=1.14,<2"
      - name: Reproduce pinned brain network-dependence summaries
        run: python -m src.brain_state_known_truth_source_reproduction_v01
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SYMC_BRAIN_STATE_KNOWN_TRUTH_SOURCE_REPRODUCTION_V01
          path: GRI_v2/brain_state_known_truth_outputs/brain_network_dependence_source_reproduction_v01.json
          if-no-files-found: error
