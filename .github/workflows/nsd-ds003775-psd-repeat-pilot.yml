name: NSD ds003775 PSD Repeat Pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/nsd-ds003775-psd-repeat-pilot.yml"
      - "NSD_vNext/atlas/manifests/ds003775_sub069_repeat_d4_manifest_v0.1.json"
      - "NSD_vNext/engine/pyproject.toml"
      - "NSD_vNext/engine/nsd_engine/edf.py"
      - "NSD_vNext/engine/nsd_engine/edf_samples.py"
      - "NSD_vNext/engine/nsd_engine/psd.py"
      - "NSD_vNext/engine/tools/d4_verify_edf_manifest.py"
      - "NSD_vNext/engine/tools/probe_psd_repeat_manifest.py"

permissions:
  contents: read

jobs:
  repeat-psd-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install qualification engine
        shell: bash
        working-directory: NSD_vNext/engine
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download pinned repeat-session EDFs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/nsd_psd_repeat"
          mkdir -p "$ROOT"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://data.nemar.org/on003775/v1.0.0/sub-069/ses-t1/eeg/sub-069_ses-t1_task-resteyesc_eeg.edf" \
            --output "$ROOT/sub-069_ses-t1_task-resteyesc_eeg.edf"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://data.nemar.org/on003775/v1.0.0/sub-069/ses-t2/eeg/sub-069_ses-t2_task-resteyesc_eeg.edf" \
            --output "$ROOT/sub-069_ses-t2_task-resteyesc_eeg.edf"

      - name: Re-verify exact payload identity before spectral analysis
        shell: bash
        run: |
          set -euo pipefail
          python NSD_vNext/engine/tools/d4_verify_edf_manifest.py \
            NSD_vNext/atlas/manifests/ds003775_sub069_repeat_d4_manifest_v0.1.json \
            "$RUNNER_TEMP/nsd_psd_repeat" \
            --output "$RUNNER_TEMP/nsd_psd_repeat/d4_identity_report.json"

      - name: Run label-blind Welch PSD repeat pilot
        shell: bash
        run: |
          set -euo pipefail
          python NSD_vNext/engine/tools/probe_psd_repeat_manifest.py \
            NSD_vNext/atlas/manifests/ds003775_sub069_repeat_d4_manifest_v0.1.json \
            "$RUNNER_TEMP/nsd_psd_repeat" \
            --output "$RUNNER_TEMP/nsd_psd_repeat/psd_repeat_pilot.json"

      - name: Upload qualification reports
        uses: actions/upload-artifact@v4
        with:
          name: ds003775-psd-repeat-pilot
          path: |
            ${{ runner.temp }}/nsd_psd_repeat/d4_identity_report.json
            ${{ runner.temp }}/nsd_psd_repeat/psd_repeat_pilot.json
          if-no-files-found: error
          retention-days: 30
