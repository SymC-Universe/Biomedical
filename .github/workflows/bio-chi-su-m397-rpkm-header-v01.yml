name: Bio Chi Su M397 RPKM header v0.1
on:
  push:
    branches: [chi-bio-recovery-p0d-20260922]
    paths:
      - 'BIO_CHI/config/SU2026_M397_RPKM_HEADER_FREEZE_v0_1.json'
      - 'BIO_CHI/src/audit_su_m397_rpkm_header_v0_1.py'
      - '.github/workflows/bio-chi-su-m397-rpkm-header-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  header:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source hash and read first logical line only
        run: python BIO_CHI/src/audit_su_m397_rpkm_header_v0_1.py
      - name: Upload header-only schema record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_SU_M397_RPKM_HEADER_V01
          path: BIO_CHI/artifacts/generated/su2026_m397_rpkm_header_v0_1.json
          if-no-files-found: error
