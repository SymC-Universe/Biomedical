name: Bio Chi GEO lineage metadata audit v0.1

on:
  push:
    branches:
      - chi-bio-recovery-p0d-20260922
    paths:
      - 'BIO_CHI/config/P0D_GEO_LINEAGE_METADATA_FREEZE_v0_1.json'
      - 'BIO_CHI/src/audit_geo_lineage_metadata_v0_1.py'
      - '.github/workflows/bio-chi-geo-lineage-metadata-v01.yml'
  pull_request:
    paths:
      - 'BIO_CHI/config/P0D_GEO_LINEAGE_METADATA_FREEZE_v0_1.json'
      - 'BIO_CHI/src/audit_geo_lineage_metadata_v0_1.py'
      - '.github/workflows/bio-chi-geo-lineage-metadata-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse hash-verified GEO metadata only
        run: python BIO_CHI/src/audit_geo_lineage_metadata_v0_1.py
      - name: Upload metadata audit
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_GEO_LINEAGE_METADATA_V01
          path: BIO_CHI/artifacts/generated/geo_lineage_metadata_audit_v0_1.json
          if-no-files-found: error
