name: Bio Chi Ecoli sensory P0-Q v0.1\n# retrieval retry after preserved Dryad 403

on:
  workflow_dispatch:
  push:
    branches:
      - bio-chi-ecoli-sensory-p0q-20260925
    paths:
      - "BIO_CHI/experiments/ecoli2024_sensory_p0q_v01.py"
      - ".github/workflows/bio-chi-ecoli-sensory-p0q-v01.yml"

jobs:
  execute-frozen-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned analysis dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.1.3" "pandas==2.2.3" "scipy==1.14.1" "requests==2.32.3"
      - name: Execute frozen E. coli sensory experiment
        run: python BIO_CHI/experiments/ecoli2024_sensory_p0q_v01.py
      - name: Hash result bundle
        if: always()
        run: |
          find BIO_CHI/experiments/ecoli_results -type f -maxdepth 1 -print0 | sort -z | xargs -0 sha256sum > BIO_CHI/experiments/ecoli_results/SHA256SUMS.txt || true
      - name: Upload complete result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_ECOLI2024_SENSORY_P0Q_V01
          path: BIO_CHI/experiments/ecoli_results/
          if-no-files-found: warn
