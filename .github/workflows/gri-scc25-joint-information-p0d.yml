name: GRI SCC25 joint-information P0-D pilot

on:
  push:
    branches:
      - gri-chi-bio-conglomerate-v01-20260918
    paths:
      - "GRI_v2/config/gri_scc25_joint_information_p0d_20260922_v1.json"
      - "GRI_v2/src/run_scc25_joint_information_p0d_v01.py"
      - ".github/workflows/gri-scc25-joint-information-p0d.yml"
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: GRI_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -q "numpy>=2,<3"
      - name: Run frozen SCC25 RNA-methylation joint-information pilot
        run: python -m src.run_scc25_joint_information_p0d_v01
      - uses: actions/upload-artifact@v4
        with:
          name: GRI_SCC25_JOINT_INFORMATION_P0D_V01
          path: GRI_v2/joint_information_scc25_outputs/scc25_joint_information_p0d_v01.json
          if-no-files-found: error
