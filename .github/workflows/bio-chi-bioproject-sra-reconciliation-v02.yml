name: Bio Chi BioProject SRA reconciliation v0.2
on:
  push:
    branches: [chi-bio-recovery-p0d-20260922]
    paths:
      - 'BIO_CHI/config/P0D_BIOPROJECT_SRA_RECONCILIATION_FREEZE_v0_2.json'
      - 'BIO_CHI/src/reconcile_bioproject_sra_v0_2.py'
      - '.github/workflows/bio-chi-bioproject-sra-reconciliation-v02.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile parent and child BioProject SRA run sets
        run: python BIO_CHI/src/reconcile_bioproject_sra_v0_2.py
      - name: Upload source reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_BIOPROJECT_SRA_RECONCILIATION_V02
          path: BIO_CHI/artifacts/generated/bioproject_sra_reconciliation_v0_2.json
          if-no-files-found: error
