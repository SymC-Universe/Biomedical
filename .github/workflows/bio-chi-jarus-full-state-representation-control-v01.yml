name: Bio Chi Jaruszewicz full-state representation control v0.1

on:
  push:
    branches:
      - chi-bio-recovery-p0d-20260922
    paths:
      - 'BIO_CHI/config/JARUS_FULL_STATE_REPRESENTATION_CONTROL_FREEZE_v0_1.json'
      - 'BIO_CHI/src/jarus_full_state_representation_control_v01.m'
      - 'BIO_CHI/src/summarize_jarus_representation_control_v01.py'
      - '.github/workflows/bio-chi-jarus-full-state-representation-control-v01.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  full-state-coordinate-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_ARTIFACT_ID: '10748186325'
      SOURCE_ARTIFACT_SHA256: '7b17c4b2ec5c3cfd280eac48155903f329a57a1a62e4918ef4fcac4ed3aea7a9'
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable v0.3 equilibrium/Jacobian artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/BIO_CHI_JARUS_LOCAL_STABILITY_V03.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip"
          echo "${SOURCE_ARTIFACT_SHA256}  /tmp/BIO_CHI_JARUS_LOCAL_STABILITY_V03.zip" | sha256sum -c -
          mkdir -p BIO_CHI/artifacts/generated/jarus_representation_control_source
          python - <<'PY'
          import pathlib, zipfile
          z=zipfile.ZipFile('/tmp/BIO_CHI_JARUS_LOCAL_STABILITY_V03.zip')
          names=[n for n in z.namelist() if pathlib.PurePosixPath(n).name=='local_stability_v0_3.json']
          if len(names)!=1: raise SystemExit(f'expected one local_stability_v0_3.json, got {names}')
          pathlib.Path('BIO_CHI/artifacts/generated/jarus_representation_control_source/local_stability_v0_3.json').write_bytes(z.read(names[0]))
          PY
      - name: Prepare pinned source and frozen Figure 8 case copies
        run: |
          set -euo pipefail
          bash BIO_CHI/src/prepare_jarus_matlab_compat.sh
          python BIO_CHI/src/prepare_jarus_fig8_cases.py
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2023b
      - name: Execute frozen full-state coordinate control
        uses: matlab-actions/run-command@v3
        with:
          command: run('BIO_CHI/src/jarus_full_state_representation_control_v01.m')
          generate-summary: false
      - name: Summarize all-mode coordinate differences
        run: python BIO_CHI/src/summarize_jarus_representation_control_v01.py
      - name: Upload raw and summarized representation-control evidence
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_JARUS_FULL_STATE_REPRESENTATION_CONTROL_V01
          path: |
            BIO_CHI/artifacts/generated/jarus_full_state_representation_control_v01/representation_control_raw_v0_1.json
            BIO_CHI/artifacts/generated/jarus_full_state_representation_control_v01/representation_control_summary_v0_1.json
          if-no-files-found: error
