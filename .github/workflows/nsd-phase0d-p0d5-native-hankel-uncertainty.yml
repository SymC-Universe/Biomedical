name: NSD Phase0D P0-D5 Native Hankel Uncertainty

on:
  push:
    branches:
      - neural-stability-dynamics-phase0d-v0.2-protocol-v0.7.1
    paths:
      - '.github/workflows/nsd-phase0d-p0d5-native-hankel-uncertainty.yml'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/src/hankel_uncertainty.py'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/scripts/run_p0d_native_hankel_uncertainty.py'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/src/ssi_cov.py'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/src/synthetic_systems.py'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/scripts/capture_environment.py'
  workflow_dispatch:

jobs:
  p0d-native-hankel-uncertainty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned P0 dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Calibrate NSD-native Hankel sampling covariance candidate
        working-directory: Neural_Stability_Dynamics/Phase0D_Protocol_v0_2
        run: python scripts/run_p0d_native_hankel_uncertainty.py --output results/p0d_mapping/native_hankel_uncertainty_v1.json
      - name: Capture environment
        working-directory: Neural_Stability_Dynamics/Phase0D_Protocol_v0_2
        run: python scripts/capture_environment.py results/p0d_mapping/native_hankel_uncertainty_environment.json
      - name: Upload P0-D uncertainty artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsd-phase0d-p0d5-native-hankel-uncertainty
          path: |
            Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/results/p0d_mapping/native_hankel_uncertainty_v1.json
            Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/results/p0d_mapping/native_hankel_uncertainty_environment.json
          if-no-files-found: error
