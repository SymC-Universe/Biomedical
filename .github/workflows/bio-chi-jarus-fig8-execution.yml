name: Bio Chi Jaruszewicz Figure 8 trajectory execution

on:
  push:
    branches:
      - chi-bio-recovery-p0d-20260922
    paths:
      - 'BIO_CHI/config/JARUS_FIG8_EXECUTION_FREEZE_v0_1.json'
      - 'BIO_CHI/src/prepare_jarus_fig8_cases.py'
      - 'BIO_CHI/src/jarus_fig8_execute.m'
      - '.github/workflows/bio-chi-jarus-fig8-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-fig8:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned source plus frozen compatibility repair
        run: bash BIO_CHI/src/prepare_jarus_matlab_compat.sh
      - name: Prepare prospectively frozen Figure 8 case copies
        run: python BIO_CHI/src/prepare_jarus_fig8_cases.py
      - name: Set up MATLAB R2023b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2023b
      - name: Execute frozen Figure 8 cases without adjudication
        id: execute
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: run('BIO_CHI/src/jarus_fig8_execute.m')
          generate-summary: false
      - name: Freeze trajectory execution provenance
        if: always()
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path('BIO_CHI/artifacts/generated/jarus_fig8_execution')
          prep=pathlib.Path('BIO_CHI/artifacts/generated/jarus_fig8_cases/case_preparation_manifest.json')
          def h(p):
              p=pathlib.Path(p)
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          summary_path=root/'execution_summary.json'
          summary=json.loads(summary_path.read_text()) if summary_path.exists() else None
          cases=[]
          for case_id in ['FIG8A_NOMINAL_DAMPED','FIG8B_LIMIT_CYCLE','FIG8C_RELAXATION_OSCILLATION']:
              d=root/case_id
              csvs=sorted(d.glob('axis_*_line_*.csv')) if d.exists() else []
              cases.append({
                  'case_id':case_id,
                  'semantic_map_sha256':h(d/'semantic_map.json'),
                  'trajectory_capture_mat_sha256':h(d/'trajectory_capture.mat'),
                  'matlab_stdout_sha256':h(d/'matlab_stdout.txt'),
                  'csv_count':len(csvs),
                  'csv_sha256':[{'file':p.name,'sha256':h(p)} for p in csvs],
              })
          ok=bool(os.environ.get('EXECUTE_OUTCOME') == 'success' and summary and len(summary.get('cases',[])) == 3 and all(x['csv_count'] > 0 for x in cases))
          result={
              'schema_version':'0.1',
              'audit_type':'prospectively_frozen_figure8_trajectory_execution',
              'status':'PASS' if ok else 'EXECUTION_FAILURE',
              'execution_freeze':'BIO_CHI/config/JARUS_FIG8_EXECUTION_FREEZE_v0_1.json',
              'source_structure_pin':'BIO_CHI/config/JARUS_SOURCE_STRUCTURE_PIN_v0_1.json',
              'case_preparation_manifest_sha256':h(prep),
              'execution_summary_sha256':h(summary_path),
              'scientific_endpoint_opened':False,
              'behavior_classified':False,
              'chi_bio_constructed':False,
              'Chi_bio_constructed':False,
              'Bio_Chi_constructed':False,
              'cases':cases,
              'interpretation_limit':'Execution and provenance only. The authors native behavior claims have not yet been adjudicated against these trajectories.'
          }
          out=root/'execution_manifest.json'
          root.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Upload frozen Figure 8 trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_JARUS_FIG8_EXECUTION_V01
          path: |
            BIO_CHI/artifacts/generated/jarus_fig8_cases/case_preparation_manifest.json
            BIO_CHI/artifacts/generated/jarus_fig8_execution/**
          if-no-files-found: warn
      - name: Enforce trajectory execution gate
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('BIO_CHI/artifacts/generated/jarus_fig8_execution/execution_manifest.json')
          if not p.exists():
              raise SystemExit('BIO_CHI_JARUS_FIG8_EXECUTION_MANIFEST_MISSING')
          result=json.loads(p.read_text())
          if result.get('status') != 'PASS':
              raise SystemExit('BIO_CHI_JARUS_FIG8_EXECUTION_FAIL')
          print('BIO_CHI_JARUS_FIG8_EXECUTION_PASS')
          PY
