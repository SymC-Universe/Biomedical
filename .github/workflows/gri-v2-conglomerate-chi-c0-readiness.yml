name: GRI Conglomerate Chi C0 readiness

on:
  workflow_dispatch:
  push:
    branches:
      - gri-conglomerate-chi-tool-v1-20260918
    paths:
      - 'GRI_v2/docs/GRI_CONGLOMERATE_CHI_TOOL_V1_DEVELOPMENT_FREEZE_20260918.md'
      - 'GRI_v2/config/gri_conglomerate_chi_tool_v1_development_20260918.json'
      - 'GRI_v2/src/audit_conglomerate_chi_c0_readiness.py'
      - 'GRI_v2/tests/test_conglomerate_chi_c0_readiness.py'
      - '.github/workflows/gri-v2-conglomerate-chi-c0-readiness.yml'
  pull_request:
    paths:
      - 'GRI_v2/docs/GRI_CONGLOMERATE_CHI_TOOL_V1_DEVELOPMENT_FREEZE_20260918.md'
      - 'GRI_v2/config/gri_conglomerate_chi_tool_v1_development_20260918.json'
      - 'GRI_v2/src/audit_conglomerate_chi_c0_readiness.py'
      - 'GRI_v2/tests/test_conglomerate_chi_c0_readiness.py'
      - '.github/workflows/gri-v2-conglomerate-chi-c0-readiness.yml'

permissions:
  contents: read

jobs:
  c0-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: GRI_v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run capital-Chi C0 contract tests
        run: python -m pytest -q tests/test_conglomerate_chi_c0_readiness.py

      - name: Execute C0 readiness audit
        run: python -m src.audit_conglomerate_chi_c0_readiness

      - name: Print readiness result
        run: cat artifacts/GRI_CONGLOMERATE_CHI_C0_READINESS_20260918.json

      - name: Upload C0 readiness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gri-conglomerate-chi-c0-readiness-20260918
          path: GRI_v2/artifacts/GRI_CONGLOMERATE_CHI_C0_READINESS_20260918.json
          retention-days: 90
          if-no-files-found: error
