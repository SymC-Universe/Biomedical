name: Bio Chi Jaruszewicz joint source audit v0.1

on:
  push:
    branches:
      - chi-bio-recovery-p0d-20260922
    paths:
      - 'BIO_CHI/src/audit_jarus_joint_source_inputs.py'
      - '.github/workflows/bio-chi-jarus-joint-source-audit-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned source
        run: |
          set -euo pipefail
          bash BIO_CHI/src/prepare_jarus_matlab_compat.sh
      - name: Audit source inputs and protocol control flow
        run: |
          set -euo pipefail
          python BIO_CHI/src/audit_jarus_joint_source_inputs.py
      - name: Hash result
        run: |
          set -euo pipefail
          sha256sum BIO_CHI/artifacts/generated/jarus_joint_source_audit/jarus_joint_source_audit_v0_1.json > BIO_CHI/artifacts/generated/jarus_joint_source_audit/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_JARUS_JOINT_SOURCE_AUDIT_V01
          path: BIO_CHI/artifacts/generated/jarus_joint_source_audit/
          if-no-files-found: error
