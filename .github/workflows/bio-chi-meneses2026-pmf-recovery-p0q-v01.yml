name: Bio Chi Meneses Ecoli PMF recovery P0-Q v0.1

on:
  push:
    branches:
      - bio-chi-ecoli-pmf-recovery-p0q-20260925
    paths:
      - "BIO_CHI/experiments/meneses2026_ecoli_pmf_recovery_p0q_v01.py"
      - ".github/workflows/bio-chi-meneses2026-pmf-recovery-p0q-v01.yml"
  workflow_dispatch:

jobs:
  execute-frozen-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.1.3" "pandas==2.2.3" "scipy==1.14.1" "requests==2.32.3" "pyarrow==18.1.0"
      - name: Execute frozen Meneses 2026 gate
        run: python BIO_CHI/experiments/meneses2026_ecoli_pmf_recovery_p0q_v01.py
      - name: Hash result bundle
        if: always()
        run: |
          find BIO_CHI/experiments/meneses2026_results -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > BIO_CHI/experiments/meneses2026_results/SHA256SUMS.txt || true
      - name: Upload complete result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_MENESES2026_ECOLI_PMF_RECOVERY_P0Q_V01
          path: BIO_CHI/experiments/meneses2026_results/
          if-no-files-found: warn
