name: NSD Structural-Order Calibration

on:
  push:
    branches:
      - nsd-rebuild-gom-v0.8.0
    paths:
      - "NSD_vNext/engine/tests/test_structural_order_refusal_contracts.py"
      - "NSD_vNext/engine/tools/probe_structural_order_finite_sample.py"
      - ".github/workflows/nsd-structural-order-calibration.yml"
  pull_request:
    branches:
      - main
    paths:
      - "NSD_vNext/engine/tests/test_structural_order_refusal_contracts.py"
      - "NSD_vNext/engine/tools/probe_structural_order_finite_sample.py"
      - ".github/workflows/nsd-structural-order-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-order:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect structural-order change
        id: changes
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(NSD_vNext/engine/tests/test_structural_order_refusal_contracts\.py|NSD_vNext/engine/tools/probe_structural_order_finite_sample\.py|\.github/workflows/nsd-structural-order-calibration\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install qualification engine
        if: steps.changes.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e NSD_vNext/engine pytest

      - name: Run exact structural-order contracts
        if: steps.changes.outputs.run == 'true'
        working-directory: NSD_vNext/engine
        run: |
          python -m pytest -q tests/test_structural_order_refusal_contracts.py

      - name: Run finite-sample structural-order map
        if: steps.changes.outputs.run == 'true'
        working-directory: NSD_vNext/engine
        run: |
          python tools/probe_structural_order_finite_sample.py \
            --output ../../structural-order/structural_order_finite_sample.json

      - name: Upload structural-order calibration
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nsd-structural-order-finite-sample
          path: structural-order/structural_order_finite_sample.json
          if-no-files-found: error
