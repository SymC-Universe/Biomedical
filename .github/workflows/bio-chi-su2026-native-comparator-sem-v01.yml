name: Bio Chi Su 2026 native comparator SEM Limit Map v0.1
on:
  push:
    branches: [bio-chi-oncology-p0q-20260924]
    paths:
      - 'BIO_CHI/config/SU2026_NATIVE_COMPARATOR_SEM_LIMIT_FREEZE_v0_1.json'
      - 'BIO_CHI/src/analyze_su2026_native_comparator_sem_limit_v0_1.py'
      - '.github/workflows/bio-chi-su2026-native-comparator-sem-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 openpyxl==3.1.5
      - name: Run frozen native-comparator and SEM Limit Map
        run: python BIO_CHI/src/analyze_su2026_native_comparator_sem_limit_v0_1.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_SU2026_NATIVE_COMPARATOR_SEM_V01
          path: |
            BIO_CHI/artifacts/generated/su2026_native_comparator_sem_limit_v0_1.json
            BIO_CHI/artifacts/generated/SU2026_NATIVE_COMPARATOR_SEM_LIMIT_V01_AUDIT.md
          if-no-files-found: error
