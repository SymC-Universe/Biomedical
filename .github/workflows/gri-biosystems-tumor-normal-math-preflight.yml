name: GRI BioSystems tumor-normal math preflight

on:
  push:
    branches:
      - gri-biosystems-revision-20260922
    paths:
      - "GRI_v2/config/biosystems_tumor_normal_control_v1_0.json"
      - "GRI_v2/src/biosystems_tumor_normal_core.py"
      - "GRI_v2/tests/test_biosystems_tumor_normal_core.py"
      - "GRI_v2/tests/test_biosystems_tumor_normal_runner.py"
      - "GRI_v2/src/run_biosystems_tumor_normal_control.py"
      - ".github/workflows/gri-biosystems-tumor-normal-math-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GRI_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pandas pytest
      - name: Compile frozen generalized core and runner
        run: python -m py_compile src/biosystems_tumor_normal_core.py src/run_biosystems_tumor_normal_control.py
      - name: Verify n30 regression equivalence, n20 definitions, and runner contracts
        run: python -m pytest -q tests/test_biosystems_tumor_normal_core.py tests/test_biosystems_tumor_normal_runner.py
