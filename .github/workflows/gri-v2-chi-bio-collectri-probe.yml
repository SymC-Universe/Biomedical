name: GRI Chi_bio CollecTRI source probe

on:
  pull_request:
    paths:
      - 'GRI_v2/src/probe_chi_bio_collectri_export.py'
      - 'GRI_v2/tests/test_chi_bio_collectri_export_probe.py'
      - '.github/workflows/gri-v2-chi-bio-collectri-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GRI_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CollecTRI client
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'decoupler==2.2.0' pandas
      - name: Probe and fingerprint human CollecTRI export
        run: python -m src.probe_chi_bio_collectri_export
      - name: Upload provenance-only export
        uses: actions/upload-artifact@v4
        with:
          name: gri-chi-bio-collectri-human-export-provenance
          path: GRI_v2/development_outputs/chi_bio_regulon_source/collectri_20260913/
          if-no-files-found: error
