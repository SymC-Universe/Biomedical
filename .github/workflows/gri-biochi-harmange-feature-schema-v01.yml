name: GRI Bio Chi Harmange feature schema v0.1
on:
  push:
    branches: [gri-biochi-bridge-p0q-20260925]
    paths:
      - 'BIO_CHI/config/HARMANGE2023_LINEAGE_MAPPING_FREEZE_v0_1.json'
      - 'BIO_CHI/src/audit_harmange2023_feature_schema_v0_1.py'
      - '.github/workflows/gri-biochi-harmange-feature-schema-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect frozen GEO feature schema
        run: python BIO_CHI/src/audit_harmange2023_feature_schema_v0_1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HARMANGE2023_FEATURE_SCHEMA_V01
          path: BIO_CHI/artifacts/generated/harmange2023_feature_schema_v0_1.json
          if-no-files-found: error
