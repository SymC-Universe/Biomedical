name: NSD Engine Contracts

on:
  push:
    paths:
      - "NSD_vNext/engine/**"
      - ".github/workflows/nsd-engine-contracts.yml"
  pull_request:
    paths:
      - "NSD_vNext/engine/**"
      - ".github/workflows/nsd-engine-contracts.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NSD_vNext/engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run NSD contract tests
        run: pytest -q
