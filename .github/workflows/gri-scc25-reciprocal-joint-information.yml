name: GRI SCC25 reciprocal joint-information challenge

on:
  push:
    branches:
      - gri-chi-bio-conglomerate-v01-20260918
    paths:
      - "GRI_v2/src/run_scc25_reciprocal_joint_information_p0q_v01.py"
      - ".github/workflows/gri-scc25-reciprocal-joint-information.yml"
      - "GRI_v2/config/gri_scc25_reciprocal_joint_information_p0q_20260922_v1.json"
      - "GRI_v2/docs/GRI_SCC25_RECIPROCAL_JOINT_INFORMATION_FREEZE_20260922.md"
  workflow_dispatch:

jobs:
  reciprocal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: GRI_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -q "numpy>=2,<3"
      - name: Run frozen reciprocal challenge
        run: python -m src.run_scc25_reciprocal_joint_information_p0q_v01
      - uses: actions/upload-artifact@v4
        with:
          name: GRI_SCC25_RECIPROCAL_JOINT_INFORMATION_P0Q_V01
          path: GRI_v2/joint_information_scc25_reciprocal_outputs/scc25_reciprocal_joint_information_p0q_v01.json
          if-no-files-found: error
