name: Bio Chi Rehman header source map v0.1
on:
  push:
    branches: [bio-chi-topdown-pivot-20260924]
    paths:
      - 'BIO_CHI/config/REHMAN2021_HEADER_SOURCE_MAP_FREEZE_v0_1.json'
      - 'BIO_CHI/src/audit_rehman2021_header_source_map_v0_1.py'
      - '.github/workflows/bio-chi-rehman-header-source-map-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit source header and GEO metadata only
        run: python BIO_CHI/src/audit_rehman2021_header_source_map_v0_1.py
      - name: Upload source map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_REHMAN_HEADER_SOURCE_MAP_V01
          path: BIO_CHI/artifacts/generated/rehman2021_header_source_map_v0_1.json
          if-no-files-found: error
