name: NSD ds003775 D4 Repeat Pair

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/nsd-ds003775-d4-repeat.yml"
      - "NSD_vNext/atlas/manifests/ds003775_sub069_repeat_d4_manifest_v0.1.json"
      - "NSD_vNext/engine/nsd_engine/edf.py"
      - "NSD_vNext/engine/nsd_engine/edf_samples.py"
      - "NSD_vNext/engine/nsd_engine/qc.py"
      - "NSD_vNext/engine/tools/d4_verify_edf_manifest.py"
      - "NSD_vNext/engine/tools/probe_edf_qc_manifest.py"

permissions:
  contents: read

jobs:
  verify-repeat-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download pinned public repeat-session EDFs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/nsd_d4_repeat"
          mkdir -p "$ROOT"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://data.nemar.org/on003775/v1.0.0/sub-069/ses-t1/eeg/sub-069_ses-t1_task-resteyesc_eeg.edf" \
            --output "$ROOT/sub-069_ses-t1_task-resteyesc_eeg.edf"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://data.nemar.org/on003775/v1.0.0/sub-069/ses-t2/eeg/sub-069_ses-t2_task-resteyesc_eeg.edf" \
            --output "$ROOT/sub-069_ses-t2_task-resteyesc_eeg.edf"

      - name: Verify repeat pair against pinned manifest
        shell: bash
        run: |
          set -euo pipefail
          python NSD_vNext/engine/tools/d4_verify_edf_manifest.py \
            NSD_vNext/atlas/manifests/ds003775_sub069_repeat_d4_manifest_v0.1.json \
            "$RUNNER_TEMP/nsd_d4_repeat" \
            --output "$RUNNER_TEMP/nsd_d4_repeat/d4_repeat_report.json"

      - name: Decode physical samples and run label-blind descriptive QC probe
        shell: bash
        run: |
          set -euo pipefail
          python NSD_vNext/engine/tools/probe_edf_qc_manifest.py \
            NSD_vNext/atlas/manifests/ds003775_sub069_repeat_d4_manifest_v0.1.json \
            "$RUNNER_TEMP/nsd_d4_repeat" \
            --start-seconds 0 \
            --duration-seconds 10 \
            --output "$RUNNER_TEMP/nsd_d4_repeat/sample_qc_probe.json"

      - name: Upload repeat-pair reports
        uses: actions/upload-artifact@v4
        with:
          name: ds003775-d4-repeat-report
          path: |
            ${{ runner.temp }}/nsd_d4_repeat/d4_repeat_report.json
            ${{ runner.temp }}/nsd_d4_repeat/sample_qc_probe.json
          if-no-files-found: error
          retention-days: 30
