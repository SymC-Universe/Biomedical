name: GRI external GEO metadata freeze

on:
  workflow_dispatch:
  push:
    branches:
      - gri-conglomerate-v1-integration-20260921
    paths:
      - ".github/workflows/gri-external-geo-metadata-freeze.yml"
      - "GRI_v2/src/freeze_external_geo_miniml_sources.py"
      - "GRI_v2/tests/test_freeze_external_geo_miniml_sources.py"
      - "GRI_v2/src/derive_external_geo_identity_tables.py"
      - "GRI_v2/tests/test_derive_external_geo_identity_tables.py"

permissions:
  contents: read

concurrency:
  group: gri-external-geo-metadata-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: GRI_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            tests/test_freeze_external_geo_miniml_sources.py \
            tests/test_derive_external_geo_identity_tables.py

      - name: Download and freeze GEO MINiML metadata
        run: |
          python -m src.freeze_external_geo_miniml_sources

      - name: Derive mechanical identity crosswalks
        run: |
          python -m src.derive_external_geo_identity_tables

      - name: Print summaries
        run: |
          cat external_source_outputs/geo_miniml_20260922/external_geo_source_manifest_summary.json
          cat external_source_outputs/identity_20260922/external_identity_summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: GRI_EXTERNAL_GEO_SOURCE_MANIFEST_SET_V01
          path: |
            GRI_v2/external_source_outputs/geo_miniml_20260922/
            GRI_v2/external_source_outputs/identity_20260922/
          if-no-files-found: error
          retention-days: 30
