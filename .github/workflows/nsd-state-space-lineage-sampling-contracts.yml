name: NSD State-Space Lineage Sampling Contracts

on:
  push:
    branches:
      - nsd-rebuild-gom-v0.8.0
    paths:
      - "NSD_vNext/engine/tests/test_state_space_lineage_sampling.py"
      - "NSD_vNext/engine/tests/test_substrate_closure_contracts.py"
      - ".github/workflows/nsd-state-space-lineage-sampling-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage-sampling-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy

      - name: Run lineage, sampling, and closure contract suites
        working-directory: NSD_vNext/engine
        run: |
          python -m pytest -q \
            tests/test_state_space_lineage_sampling.py \
            tests/test_substrate_closure_contracts.py
