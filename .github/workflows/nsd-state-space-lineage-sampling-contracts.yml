name: NSD State-Space Lineage Sampling Contracts

on:
  push:
    branches:
      - nsd-rebuild-gom-v0.8.0
    paths:
      - "NSD_vNext/engine/tests/test_state_space_lineage_sampling.py"
      - "NSD_vNext/engine/tests/test_substrate_closure_contracts.py"
      - "NSD_vNext/engine/tests/test_continuous_lineage_truth_contracts.py"
      - "NSD_vNext/engine/tests/test_predictive_closure_contracts.py"
      - "NSD_vNext/engine/tools/probe_continuous_lineage_nonzero_g.py"
      - "NSD_vNext/engine/tools/probe_predictive_closure_calibration.py"
      - ".github/workflows/nsd-state-space-lineage-sampling-contracts.yml"
  pull_request:
    branches:
      - main
    paths:
      - "NSD_vNext/engine/tests/test_state_space_lineage_sampling.py"
      - "NSD_vNext/engine/tests/test_substrate_closure_contracts.py"
      - "NSD_vNext/engine/tests/test_continuous_lineage_truth_contracts.py"
      - "NSD_vNext/engine/tests/test_predictive_closure_contracts.py"
      - "NSD_vNext/engine/tools/probe_continuous_lineage_nonzero_g.py"
      - "NSD_vNext/engine/tools/probe_predictive_closure_calibration.py"
      - ".github/workflows/nsd-state-space-lineage-sampling-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage-sampling-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy

      - name: Run lineage, sampling, and closure contract suites
        working-directory: NSD_vNext/engine
        run: |
          python -m pytest -q \
            tests/test_state_space_lineage_sampling.py \
            tests/test_substrate_closure_contracts.py \
            tests/test_continuous_lineage_truth_contracts.py \
            tests/test_predictive_closure_contracts.py

      - name: Run exploratory nonzero-g continuous-lineage probe
        working-directory: NSD_vNext/engine
        run: |
          python tools/probe_continuous_lineage_nonzero_g.py \
            --output ../../continuous-lineage-probe/continuous_lineage_nonzero_g.json

      - name: Upload exploratory continuous-lineage probe
        uses: actions/upload-artifact@v4
        with:
          name: nsd-continuous-lineage-nonzero-g-probe
          path: continuous-lineage-probe/continuous_lineage_nonzero_g.json
          if-no-files-found: error

      - name: Run exploratory predictive-closure calibration map
        working-directory: NSD_vNext/engine
        run: |
          python tools/probe_predictive_closure_calibration.py \
            --output ../../predictive-closure-probe/predictive_closure_calibration.json

      - name: Upload exploratory predictive-closure calibration map
        uses: actions/upload-artifact@v4
        with:
          name: nsd-predictive-closure-calibration-probe
          path: predictive-closure-probe/predictive_closure_calibration.json
          if-no-files-found: error
