name: NSD State-Space Adequacy Map

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/nsd-state-space-adequacy.yml"
      - "NSD_vNext/engine/pyproject.toml"
      - "NSD_vNext/engine/nsd_engine/state_space_adequacy.py"
      - "NSD_vNext/engine/nsd_engine/latent_oscillator_covariance.py"
      - "NSD_vNext/engine/tools/probe_state_space_model_adequacy.py"

permissions:
  contents: read

concurrency:
  group: nsd-state-space-adequacy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard against unrelated long-lived-PR retriggers
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          SHOULD_RUN=true

          if [[ "$EVENT_NAME" == "pull_request" && "$EVENT_ACTION" == "synchronize" ]]; then
            if [[ -n "$BEFORE_SHA" && -n "$AFTER_SHA" ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              if git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- \
                .github/workflows/nsd-state-space-adequacy.yml \
                NSD_vNext/engine/pyproject.toml \
                NSD_vNext/engine/nsd_engine/state_space_adequacy.py \
                NSD_vNext/engine/nsd_engine/latent_oscillator_covariance.py \
                NSD_vNext/engine/tools/probe_state_space_model_adequacy.py
              then
                SHOULD_RUN=false
              fi
            fi
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "should_run=$SHOULD_RUN"

  adequacy-map:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen numerical stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e NSD_vNext/engine

      - name: Run A0 A1 A2 likelihood adequacy map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nsd_state_space_adequacy"
          python NSD_vNext/engine/tools/probe_state_space_model_adequacy.py \
            --output "$RUNNER_TEMP/nsd_state_space_adequacy/state_space_adequacy_map.json"

      - name: Upload adequacy map
        uses: actions/upload-artifact@v4
        with:
          name: nsd-state-space-adequacy-map
          path: ${{ runner.temp }}/nsd_state_space_adequacy/state_space_adequacy_map.json
          if-no-files-found: error
          retention-days: 30
