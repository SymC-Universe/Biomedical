name: GRI BioSystems external prostate P1 confirmation

on:
  workflow_dispatch:
  push:
    branches:
      - gri-biosystems-revision-20260922
    paths:
      - '.github/workflows/gri-biosystems-external-prostate-p1.yml'
      - 'GRI_v2/src/run_biosystems_external_prostate_p1.py'
      - 'GRI_v2/config/biosystems_external_prostate_p1_v1_0.json'
      - 'GRI_v2/support/c1_probe_ids_22601.txt'
      - 'GRI_v2/support/tn_c1_core_mask_payload.lzma.b64'
      - 'GRI_v2/reviewer/BIOSYSTEMS_EXTERNAL_PROSTATE_P1_EXECUTION_CLARIFICATION_20260922.md'

jobs:
  p1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas

      - name: Acquire exact external sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p1_sources
          curl --fail --location --retry 5 --retry-delay 3 \
            'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE237nnn/GSE237995/suppl/GSE237995_RawCounts.csv.gz' \
            -o p1_sources/GSE237995_RawCounts.csv.gz
          curl --fail --location --retry 5 --retry-delay 3 \
            'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE262nnn/GSE262522/suppl/GSE262522_m450K_Proc_Funnorm.tsv.gz' \
            -o p1_sources/GSE262522_m450K_Proc_Funnorm.tsv.gz
          curl --fail --location --retry 5 --retry-delay 3 \
            'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE262nnn/GSE262524/suppl/GSE262524_EPIC_Proc_Funnorm.tsv.gz' \
            -o p1_sources/GSE262524_EPIC_Proc_Funnorm.tsv.gz

      - name: Acquire exact frozen Hallmark GMT
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 \
            'https://data.broadinstitute.org/gsea-msigdb/msigdb/release/2026.1.Hs/h.all.v2026.1.Hs.symbols.gmt' \
            -o p1_sources/h.all.v2026.1.Hs.symbols.gmt || true
          python - <<'PY'
          import hashlib, pathlib, urllib.request
          p=pathlib.Path('p1_sources/h.all.v2026.1.Hs.symbols.gmt')
          exp='eecaf6dad908334ae885406ec72bdc0646d8917588ed7c219fac92fc5363f596'
          def sha(x):
              h=hashlib.sha256()
              with open(x,'rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''): h.update(b)
              return h.hexdigest()
          if (not p.exists()) or sha(p)!=exp:
              urllib.request.urlretrieve(
                'https://raw.githubusercontent.com/JeanRadig/KaleidoCell/main/kaleidocell/files/h.all.v2026.1.Hs.symbols.gmt', p
              )
          got=sha(p)
          if got!=exp: raise SystemExit(f'Hallmark hash mismatch {got}')
          print('Hallmark source identity PASS')
          PY

      - name: Execute frozen P1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf P1_RESULTS
          PYTHONPATH=GRI_v2 python GRI_v2/src/run_biosystems_external_prostate_p1.py \
            --config GRI_v2/config/biosystems_external_prostate_p1_v1_0.json \
            --rna p1_sources/GSE237995_RawCounts.csv.gz \
            --m450 p1_sources/GSE262522_m450K_Proc_Funnorm.tsv.gz \
            --epic p1_sources/GSE262524_EPIC_Proc_Funnorm.tsv.gz \
            --gmt p1_sources/h.all.v2026.1.Hs.symbols.gmt \
            --c1-probes GRI_v2/support/c1_probe_ids_22601.txt \
            --support GRI_v2/support/tn_c1_core_mask_payload.lzma.b64 \
            --out P1_RESULTS \
            --workers 4

      - name: Hash outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('P1_RESULTS')
          rows=[]
          for p in sorted(root.glob('*')):
              if p.is_file():
                  h=hashlib.sha256()
                  with p.open('rb') as f:
                      for b in iter(lambda:f.read(1<<20),b''): h.update(b)
                  rows.append({'file':p.name,'bytes':p.stat().st_size,'sha256':h.hexdigest()})
          (root/'P1_OUTPUT_SHA256.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY

      - name: Remove large source material
        if: always()
        run: rm -rf p1_sources

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GRI_BIOSYSTEMS_EXTERNAL_PROSTATE_P1_V01
          path: P1_RESULTS
          if-no-files-found: warn
