name: Bio Chi Jaruszewicz joint source audit v0.3

on:
  push:
    branches:
      - chi-bio-recovery-p0d-20260922
    paths:
      - '.github/workflows/bio-chi-jarus-joint-source-audit-v03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash BIO_CHI/src/prepare_jarus_matlab_compat.sh
      - run: python BIO_CHI/src/audit_jarus_joint_source_inputs.py
      - uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_JARUS_JOINT_SOURCE_AUDIT_V03
          path: BIO_CHI/artifacts/generated/jarus_joint_source_audit/
          if-no-files-found: error
