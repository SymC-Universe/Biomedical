name: NSD Phase0D P0-D6 DMD Real-Pole Diagnosis
on:
  push:
    branches: [neural-stability-dynamics-phase0d-v0.2-protocol-v0.7.1]
    paths:
      - '.github/workflows/nsd-phase0d-p0d6-dmd-real-pole-diagnosis.yml'
      - 'Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/scripts/run_p0d_p0q1_dmd_realpole_diagnosis.py'
  workflow_dispatch:
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Run retrospective diagnosis
        working-directory: Neural_Stability_Dynamics/Phase0D_Protocol_v0_2
        run: python scripts/run_p0d_p0q1_dmd_realpole_diagnosis.py
      - uses: actions/upload-artifact@v4
        with:
          name: nsd-p0d6-dmd-real-pole-diagnosis
          path: Neural_Stability_Dynamics/Phase0D_Protocol_v0_2/results/p0d_mapping/p0q1_dmd_realpole_diagnosis.json
          if-no-files-found: error
