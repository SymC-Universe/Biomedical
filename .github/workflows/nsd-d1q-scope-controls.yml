name: NSD D1Q Scope Controls

on:
  push:
    branches:
      - nsd-rebuild-gom-v0.8.0
    paths:
      - "NSD_vNext/engine/nsd_engine/discrete_exact_candidate.py"
      - "NSD_vNext/engine/tests/test_discrete_exact_candidate.py"
      - "NSD_vNext/engine/tools/probe_d1q_scope_controls.py"
      - ".github/workflows/nsd-d1q-scope-controls.yml"
  pull_request:
    branches:
      - main
    paths:
      - "NSD_vNext/engine/nsd_engine/discrete_exact_candidate.py"
      - "NSD_vNext/engine/tests/test_discrete_exact_candidate.py"
      - "NSD_vNext/engine/tools/probe_d1q_scope_controls.py"
      - ".github/workflows/nsd-d1q-scope-controls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d1q-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect D1Q scope change
        id: changes
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(NSD_vNext/engine/nsd_engine/discrete_exact_candidate\.py|NSD_vNext/engine/tests/test_discrete_exact_candidate\.py|NSD_vNext/engine/tools/probe_d1q_scope_controls\.py|\.github/workflows/nsd-d1q-scope-controls\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install qualification engine
        if: steps.changes.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e NSD_vNext/engine pytest

      - name: Run D1Q contracts
        if: steps.changes.outputs.run == 'true'
        working-directory: NSD_vNext/engine
        run: |
          python -m pytest -q tests/test_discrete_exact_candidate.py

      - name: Run D1Q scope controls
        if: steps.changes.outputs.run == 'true'
        working-directory: NSD_vNext/engine
        run: |
          python tools/probe_d1q_scope_controls.py \
            --output ../../d1q-scope/d1q_scope_controls.json

      - name: Upload D1Q scope controls
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nsd-d1q-scope-controls
          path: d1q-scope/d1q_scope_controls.json
          if-no-files-found: error
