name: GRI Conglomerate Chi C1 carrier contract

on:
  workflow_dispatch:
  push:
    branches:
      - gri-conglomerate-chi-tool-v1-20260918
    paths:
      - 'GRI_v2/docs/GRI_CONGLOMERATE_CHI_C1_CARRIER_MATERIALIZATION_CONTRACT_20260918.md'
      - 'GRI_v2/config/gri_conglomerate_chi_carrier_schema_v1.json'
      - 'GRI_v2/src/materialize_conglomerate_chi_c1.py'
      - 'GRI_v2/tests/test_materialize_conglomerate_chi_c1.py'
      - '.github/workflows/gri-v2-conglomerate-chi-c1-carrier-contract.yml'

permissions:
  contents: read

jobs:
  carrier-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: GRI_v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<10'

      - name: Run C1 known-truth carrier tests
        run: python -m pytest -q tests/test_materialize_conglomerate_chi_c1.py
