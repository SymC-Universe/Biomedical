name: Bio Chi Jaruszewicz simulation horizon audit

on:
  push:
    branches:
      - chi-bio-recovery-p0d-20260922
    paths:
      - 'BIO_CHI/src/audit_jarus_simulation_horizon.py'
      - 'BIO_CHI/src/prepare_jarus_matlab_compat.sh'
      - '.github/workflows/bio-chi-jarus-simulation-horizon.yml'
  pull_request:
    paths:
      - 'BIO_CHI/src/audit_jarus_simulation_horizon.py'
      - 'BIO_CHI/src/prepare_jarus_matlab_compat.sh'
      - '.github/workflows/bio-chi-jarus-simulation-horizon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned source plus frozen compatibility copy
        run: bash BIO_CHI/src/prepare_jarus_matlab_compat.sh
      - name: Audit simulator time-horizon control flow
        run: python BIO_CHI/src/audit_jarus_simulation_horizon.py
      - name: Upload horizon audit
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_JARUS_SIMULATION_HORIZON_V01
          path: BIO_CHI/artifacts/generated/jarus_simulation_horizon/simulation_horizon_v0_1.json
          if-no-files-found: error
