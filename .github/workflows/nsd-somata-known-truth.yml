name: NSD SOMATA Known-Truth Comparator

on:
  workflow_dispatch:
  push:
    branches:
      - nsd-rebuild-gom-v0.8.0
    paths:
      - ".github/workflows/nsd-somata-known-truth.yml"
      - "NSD_vNext/docs/SOMATA_COMPARATOR_FAIRNESS_FREEZE_v0.1.md"
      - "NSD_vNext/docs/manifests/somata_comparator_fairness_v0.1.json"
      - "NSD_vNext/engine/tools/compare_somata_known_truth.py"
      - "NSD_vNext/engine/tools/probe_state_space_model_adequacy.py"
      - "NSD_vNext/engine/nsd_engine/state_space_adequacy.py"

permissions:
  contents: read

concurrency:
  group: nsd-somata-known-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned comparator and NSD engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install "somata==0.5.6"
          python -m pip install -e NSD_vNext/engine

      - name: Capture exact environment
        run: |
          mkdir -p "$RUNNER_TEMP/nsd_somata_known_truth"
          python -m pip freeze > "$RUNNER_TEMP/nsd_somata_known_truth/pip_freeze.txt"
          python - <<'PY' > "$RUNNER_TEMP/nsd_somata_known_truth/environment.json"
          import json, platform
          import numpy, scipy, somata
          try:
              import torch
              torch_version = torch.__version__
          except Exception:
              torch_version = None
          print(json.dumps({
              "python": platform.python_version(),
              "numpy": numpy.__version__,
              "scipy": scipy.__version__,
              "somata": "0.5.6",
              "torch": torch_version,
          }, indent=2, sort_keys=True))
          PY

      - name: Run matched-information known-truth comparator
        run: |
          python NSD_vNext/engine/tools/compare_somata_known_truth.py \
            --output "$RUNNER_TEMP/nsd_somata_known_truth/result.json"

      - uses: actions/upload-artifact@v4
        with:
          name: nsd-somata-known-truth-v0-1
          path: |
            ${{ runner.temp }}/nsd_somata_known_truth/result.json
            ${{ runner.temp }}/nsd_somata_known_truth/environment.json
            ${{ runner.temp }}/nsd_somata_known_truth/pip_freeze.txt
          if-no-files-found: error
          retention-days: 30
