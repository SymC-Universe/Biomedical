name: Bio Chi Harmange top-down analysis v0.1
on:
  push:
    branches: [bio-chi-topdown-pivot-20260924]
    paths:
      - 'BIO_CHI/config/HARMANGE2023_TOPDOWN_EVENT_FREEZE_v0_1.json'
      - 'BIO_CHI/src/analyze_harmange2023_topdown_v0_1.py'
      - '.github/workflows/bio-chi-harmange-topdown-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Run frozen Harmange top-down event analysis
        run: python BIO_CHI/src/analyze_harmange2023_topdown_v0_1.py
      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_HARMANGE_TOPDOWN_V01
          path: |
            BIO_CHI/artifacts/generated/harmange2023_topdown_analysis_v0_1.json
            BIO_CHI/artifacts/generated/HARMANGE2023_TOPDOWN_ANALYSIS_V01_AUDIT.md
          if-no-files-found: error
