name: GRI conglomerate Chi-bio v0.1 synthetic gate

on:
  push:
    branches:
      - gri-chi-bio-conglomerate-v01-20260918
      - gri-conglomerate-v1-integration-20260921
    paths:
      - "GRI_v2/src/conglomerate_chi_v01.py"
      - "GRI_v2/tests/test_conglomerate_chi_v01.py"
      - "GRI_v2/config/chi_bio_conglomerate_v01_source_bindings.json"
      - "GRI_v2/config/gri_external_claim_scrutiny_v01.json"
      - "GRI_v2/src/validate_conglomerate_v01_source_bindings.py"
      - "GRI_v2/tests/test_conglomerate_v01_source_bindings.py"
      - "GRI_v2/src/validate_gri_external_claim_scrutiny.py"
      - "GRI_v2/tests/test_gri_external_claim_scrutiny.py"
      - "GRI_v2/docs/GRI_CHI_BIO_CONGLOMERATE_V01_SOURCE_BINDING_20260918.md"
      - "GRI_v2/docs/GRI_CHI_BIO_CONGLOMERATE_V01_PRERESULT_CONTRACT_20260918.md"
      - ".github/workflows/gri-conglomerate-chi-v01.yml"
  workflow_dispatch:

jobs:
  synthetic-known-truth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GRI_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2,<3" "pandas>=2.2,<3" "pytest>=8,<10"
      - name: Run conglomerate carrier and source-binding tests
        run: python -m pytest -q tests/test_conglomerate_chi_v01.py tests/test_conglomerate_v01_source_bindings.py tests/test_gri_external_claim_scrutiny.py
      - name: Validate frozen source bindings
        run: python -m src.validate_conglomerate_v01_source_bindings
      - name: Validate external claim scrutiny ledger
        run: python -m src.validate_gri_external_claim_scrutiny
      - name: Generate synthetic known-truth artifact
        run: python -m src.conglomerate_chi_v01
      - uses: actions/upload-artifact@v4
        with:
          name: GRI_CHI_BIO_CONGLOMERATE_V01_SYNTHETIC
          path: GRI_v2/conglomerate_v01_outputs/
          if-no-files-found: error
