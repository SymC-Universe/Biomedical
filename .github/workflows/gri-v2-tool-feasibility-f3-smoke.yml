name: GRI v2 tool feasibility F3 dependency smoke

on:
  push:
    branches: [gri-v2]
    paths:
      - '.github/workflows/gri-v2-tool-feasibility-f3-smoke.yml'
  workflow_dispatch:

jobs:
  python-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - name: Install MOFA2
        run: python -m pip install mofapy2
      - name: Smoke MOFA2 import
        run: |
          python - <<'PY'
          import mofapy2
          print('MOFAPY2_IMPORT_OK', getattr(mofapy2, '__version__', 'unknown'))
          PY
      - name: Install maintained AJIVE/MCCA lineage
        run: |
          python -m pip install git+https://github.com/idc9/ya_pca.git
          python -m pip install git+https://github.com/idc9/mvdr.git
      - name: Smoke mvdr imports
        run: |
          python - <<'PY'
          from mvdr.mcca.mcca import MCCA
          print('MVDR_MCCA_IMPORT_OK', MCCA)
          try:
              from mvdr.ajive.AJIVE import AJIVE
              print('MVDR_AJIVE_IMPORT_OK', AJIVE)
          except Exception as exc:
              print('MVDR_AJIVE_IMPORT_FAILED', type(exc).__name__, str(exc))
              raise
          PY

  divas-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install remotes
        run: Rscript -e 'install.packages("remotes", repos="https://cloud.r-project.org")'
      - name: Install DIVAS from published repository
        run: Rscript -e 'remotes::install_github("ByronSyun/DIVAS", upgrade="never")'
      - name: Smoke DIVAS import
        run: Rscript -e 'library(DIVAS); cat("DIVAS_IMPORT_OK\n")'
