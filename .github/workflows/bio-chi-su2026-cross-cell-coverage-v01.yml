name: Bio Chi Su 2026 cross-cell carrier coverage v0.1
on:
  push:
    branches: [bio-chi-oncology-p0q-20260924]
    paths:
      - 'BIO_CHI/config/SU2026_CROSS_CELL_CARRIER_COVERAGE_FREEZE_v0_1.json'
      - 'BIO_CHI/src/audit_su2026_cross_cell_carrier_coverage_v0_1.py'
      - '.github/workflows/bio-chi-su2026-cross-cell-coverage-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Audit carrier coverage without reading cross-cell expression values
        run: python BIO_CHI/src/audit_su2026_cross_cell_carrier_coverage_v0_1.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_SU2026_CROSS_CELL_COVERAGE_V01
          path: BIO_CHI/artifacts/generated/su2026_cross_cell_carrier_coverage_v0_1.json
          if-no-files-found: error
