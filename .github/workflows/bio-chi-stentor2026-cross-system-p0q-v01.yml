name: Bio Chi Stentor cross-system path P0-Q v0.1

on:
  workflow_dispatch:
  push:
    branches:
      - bio-chi-stentor-cross-system-p0q-20260926
    paths:
      - "BIO_CHI/experiments/stentor2026_extract_features.jl"
      - "BIO_CHI/experiments/stentor2026_cross_system_p0q_v01.py"
      - ".github/workflows/bio-chi-stentor2026-cross-system-p0q-v01.yml"

jobs:
  execute-frozen-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch only pinned Stentor behavioral LFS object
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git lfs install
          git clone --filter=blob:none --no-checkout https://github.com/tejasramdas/stentor_habituation.git stentor_upstream
          cd stentor_upstream
          git checkout 8704c114555af3477a1dd7471beedde205fed263
          git lfs pull --include="processed_data/collated.jld2" --exclude=""
          test "$(sha256sum processed_data/collated.jld2 | awk '{print $1}')" = "b84054675f8a608471da1d9cccd051c1fb9503d35b3c9b5b9f6ebc378e75054f"
          test "$(stat -c%s processed_data/collated.jld2)" = "13922257"
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - name: Install minimal Julia source reader
        run: julia -e 'using Pkg; Pkg.add(name="JLD2", version="0.5")'
      - name: Extract frozen behavioral representation
        env:
          STENTOR_COLLATED_PATH: stentor_upstream/processed_data/collated.jld2
        run: julia BIO_CHI/experiments/stentor2026_extract_features.jl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Python analysis dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.1.3" "pandas==2.2.3" "scikit-learn==1.5.2"
      - name: Execute frozen cross-system gate
        run: python BIO_CHI/experiments/stentor2026_cross_system_p0q_v01.py
      - name: Hash result bundle
        if: always()
        run: |
          find BIO_CHI/experiments/stentor2026_cross_system_results -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > BIO_CHI/experiments/stentor2026_cross_system_results/SHA256SUMS.txt || true
      - name: Upload complete result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_STENTOR2026_CROSS_SYSTEM_P0Q_V01
          path: BIO_CHI/experiments/stentor2026_cross_system_results/
          if-no-files-found: warn
