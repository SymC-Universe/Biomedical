name: GRI v2 Stage C0 methylation source gate

on:
  workflow_dispatch:
  push:
    branches:
      - gri-v2
      - gri-v2-stage-c0-methylation
    paths:
      - 'GRI_v2/config/stage_c0_methylation_source_plan.json'
      - 'GRI_v2/docs/STAGE_C0_METHYLATION_PREREGISTRATION_20260830.md'
      - 'GRI_v2/src/probe_stage_c0_methylation.py'
      - 'GRI_v2/src/validate_stage_c0_cache.py'
      - 'GRI_v2/tests/test_stage_c0_methylation_contract.py'
      - 'GRI_v2/tests/test_stage_c0_cache_validator.py'
      - 'GRI_v2/RUN_STAGE_C0_METHYLATION_WINDOWS.bat'
      - '.github/workflows/gri-v2-stage-c0-methylation.yml'

jobs:
  metadata-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test/runtime dependencies
        working-directory: GRI_v2
        run: python -m pip install -r requirements.txt
      - name: Run full GRI v2 tests
        working-directory: GRI_v2
        run: python -m pytest -q
      - name: Probe frozen methylation endpoint without downloading source
        working-directory: GRI_v2
        run: |
          python -m src.probe_stage_c0_methylation \
            --plan config/stage_c0_methylation_source_plan.json \
            --out stage_c0_metadata
      - name: Upload metadata-only gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: gri-v2-stage-c0-methylation-metadata-gate
          path: GRI_v2/stage_c0_metadata/STAGE_C0_METHYLATION_SOURCE_SUMMARY.json
          if-no-files-found: error
      - name: Build exact Windows handoff payload
        run: |
          set -euo pipefail
          H=CSA_STAGE_C0_METHYLATION_WINDOWS_20260830
          mkdir -p "$H/config" "$H/docs" "$H/src" "$H/tests"
          cp GRI_v2/RUN_STAGE_C0_METHYLATION_WINDOWS.bat "$H/"
          cp GRI_v2/requirements.txt "$H/"
          cp GRI_v2/scripts_select_file.py "$H/"
          cp GRI_v2/config/stage_c0_methylation_source_plan.json "$H/config/"
          cp GRI_v2/docs/STAGE_C0_METHYLATION_PREREGISTRATION_20260830.md "$H/docs/"
          cp GRI_v2/src/probe_stage_c0_methylation.py "$H/src/"
          cp GRI_v2/src/validate_stage_c0_cache.py "$H/src/"
          cp GRI_v2/tests/test_stage_c0_methylation_contract.py "$H/tests/"
          cp GRI_v2/tests/test_stage_c0_cache_validator.py "$H/tests/"
          cat > "$H/README_HANDOFF.txt" <<'EOF'
          Cancer Stability Atlas - Stage C0 methylation source gate

          Purpose: acquire and source-audit the frozen PanCanAtlas merged HM27/HM450 methylation matrix without biological association testing.

          1. Extract this archive to a normal local folder.
          2. If a previous Stage C0 folder already contains large_sources, copy or move that entire folder into this handoff so valid acquired data are reused.
          3. Double-click RUN_STAGE_C0_METHYLATION_WINDOWS.bat.
          4. When prompted, select the actual existing completed Stage A hallmark_profile_cache.npz. Filenames containing parentheses are supported.
          5. The launcher validates the exact frozen Stage A SHA-256 before any methylation acquisition/audit.
          6. At completion, return only:
             stage_c0_methylation_outputs/STAGE_C0_METHYLATION_SOURCE_SUMMARY.json
             stage_c0_methylation_outputs/stage_c0_methylation_cancer_coverage.csv
          7. Keep the downloaded 5.02 GB matrix locally. Do not upload it to ChatGPT or commit it to GitHub.

          This stage computes no chi, no CV/2, no composite stability score, and no methylation biological association.
          EOF
          (cd "$H" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - name: Upload tested Stage C0 Windows handoff
        uses: actions/upload-artifact@v4
        with:
          name: CSA_STAGE_C0_METHYLATION_WINDOWS_20260830
          path: CSA_STAGE_C0_METHYLATION_WINDOWS_20260830/
          if-no-files-found: error
          retention-days: 90
