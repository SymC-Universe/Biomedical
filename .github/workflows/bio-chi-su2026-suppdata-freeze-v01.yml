name: Bio Chi Su 2026 supplementary workbook freeze v0.1
on:
  push:
    branches: [bio-chi-oncology-p0q-20260924]
    paths:
      - 'BIO_CHI/config/SU2026_SUPPDATA_WORKBOOK_FREEZE_v0_1.json'
      - 'BIO_CHI/src/freeze_su2026_suppdata_workbook_v0_1.py'
      - '.github/workflows/bio-chi-su2026-suppdata-freeze-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spreadsheet reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Freeze supplementary workbook bytes and text-only schema
        run: python BIO_CHI/src/freeze_su2026_suppdata_workbook_v0_1.py
      - name: Upload source-freeze result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIO_CHI_SU2026_SUPPDATA_WORKBOOK_FREEZE_V01
          path: BIO_CHI/artifacts/generated/su2026_suppdata_workbook_freeze_v0_1.json
          if-no-files-found: error
