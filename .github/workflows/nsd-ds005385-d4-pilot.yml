name: NSD ds005385 D4 Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - nsd-rebuild-gom-v0.8.0
    paths:
      - ".github/workflows/nsd-ds005385-d4-pilot.yml"
      - "NSD_vNext/docs/manifests/ds005385_d4_pilot_expectation_v0.1.json"
      - "NSD_vNext/engine/nsd_engine/edf.py"
      - "NSD_vNext/engine/tests/test_edf.py"
      - "NSD_vNext/engine/tools/d4_verify_ds005385_pilot.py"

permissions:
  contents: read

concurrency:
  group: nsd-ds005385-d4-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pilot-payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned NSD engine and test dependency
        run: |
          python -m pip install --disable-pip-version-check ./NSD_vNext/engine pytest
          python -m pip check

      - name: Regression-test EDF parser provenance override
        run: |
          python -m pytest -q NSD_vNext/engine/tests/test_edf.py

      - name: Download pinned public EDF pilot from NEMAR
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nsd_ds005385_d4"
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://data.nemar.org/on005385/v1.0.0/sub-001/ses-1/eeg/sub-001_ses-1_task-EyesClosed_acq-pre_eeg.edf" \
            --output "$RUNNER_TEMP/nsd_ds005385_d4/sub-001_ses-1_task-EyesClosed_acq-pre_eeg.edf"

      - name: Verify immutable identity and structural EDF fields
        run: |
          python NSD_vNext/engine/tools/d4_verify_ds005385_pilot.py \
            "$RUNNER_TEMP/nsd_ds005385_d4/sub-001_ses-1_task-EyesClosed_acq-pre_eeg.edf" \
            --output "$RUNNER_TEMP/nsd_ds005385_d4/d4_pilot_report.json"

      - uses: actions/upload-artifact@v4
        with:
          name: ds005385-d4-pilot-report-v0-1
          path: ${{ runner.temp }}/nsd_ds005385_d4/d4_pilot_report.json
          if-no-files-found: error
          retention-days: 30
